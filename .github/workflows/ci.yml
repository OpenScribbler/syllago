name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.5'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3
          working-directory: cli

  # Coverage Drift: Go SupportsType claims vs the mirrored Capability Feed
  # data in docs/provider-capabilities/. Deliberately NOT a required check —
  # the feed legitimately outpaces Go, so red here is a signal, not a block.
  coverage-drift:
    name: Coverage Drift (non-required)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.5'
          cache-dependency-path: cli/go.sum

      - name: Check Go claims against the Capability Feed mirror
        working-directory: cli
        run: SYLLAGO_COVERAGE_FEED=1 go test ./internal/provider/ -run TestCoverageFeedDrift

  test-and-build:
    name: Go Test + Build
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.5'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        working-directory: cli
        # GO-2026-5932 (golang.org/x/crypto/openpgp is unmaintained) is
        # allowlisted: it has no fixed version (Fixed in: N/A) and is
        # reachable only through rekor's entry-type registry, which
        # sigstore-go requires for MOAT verification. Syllago never feeds
        # PGP content into that path. Revisit when rekor drops its
        # openpgp-based PKI types. Everything else fails the build.
        run: |
          govulncheck -format json ./... > vuln.json || true
          FINDINGS=$(jq -r 'select(.finding != null) | select(.finding.trace[0].function != null) | .finding.osv' vuln.json | sort -u | grep -v '^GO-2026-5932$' || true)
          if [ -n "$FINDINGS" ]; then
            echo "govulncheck found non-allowlisted vulnerabilities:"
            echo "$FINDINGS"
            govulncheck ./... || true
            exit 1
          fi
          echo "govulncheck clean (allowlisted: GO-2026-5932)"

      - name: Run go vet
        working-directory: cli
        run: go vet ./...

      - name: Check go mod tidy
        working-directory: cli
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run tests with race detector
        working-directory: cli
        run: go test -race ./...

      - name: Build smoke check
        working-directory: cli
        run: go build ./cmd/syllago

      - name: Check commands.json freshness
        working-directory: cli
        run: |
          go build -o syllago-ci ./cmd/syllago
          ./syllago-ci _gendocs > commands.json.tmp
          # Strip volatile fields (timestamp, version) before comparing command definitions
          grep -v '"generatedAt"' commands.json | grep -v '"syllagoVersion"' > commands.json.stable
          grep -v '"generatedAt"' commands.json.tmp | grep -v '"syllagoVersion"' > commands.json.tmp.stable
          diff -u commands.json.stable commands.json.tmp.stable
          rm -f syllago-ci commands.json.tmp commands.json.stable commands.json.tmp.stable
