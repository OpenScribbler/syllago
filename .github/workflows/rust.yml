name: Rust

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ACIF_SHA: d82cfdc854c53888c414ec2835b656f579e14a18
  MOAT_SHA: 8330bf227f9894f8a88b48f9cad5e1af04044835
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Hashing is byte-exact: no checkout may rewrite line endings.
      - name: Disable line-ending conversion
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout ACIF conformance suite
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OpenScribbler/agent-content-interchange-format
          ref: ${{ env.ACIF_SHA }}
          path: acif
          persist-credentials: false

      - name: Checkout MOAT reference
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OpenScribbler/moat
          ref: ${{ env.MOAT_SHA }}
          path: moat
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install pyyaml==6.0.3

      # The committed vectors must be exactly what MOAT's generator emits at
      # MOAT_SHA; regenerate them with the same command after bumping it.
      - name: MOAT vector drift
        env:
          MOAT_DIR: moat
        run: python scripts/moat-vectors.py | diff -u crates/moat/tests/vectors/moat-vectors.json -

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # moat's testing feature holds a signer that must never sign real
      # content. Only moat's own dev-dependency may enable it, so it must not
      # be among moat's resolved features once dev-dependencies are left out,
      # whether a default feature or another crate's dependency turns it on.
      - name: moat testing feature stays out of non-dev builds
        run: |
          tree=$(cargo tree --workspace --locked -e no-dev --format '{p} features=[{f}]' --prefix none)
          if grep -E '^moat v.* features=\[(.*,)?testing(,.*)?\]' <<<"$tree"; then
            echo "moat's testing feature is enabled outside dev-dependencies" >&2
            exit 1
          fi

      - name: cargo test
        run: cargo test --workspace --locked

      - name: ACIF conformance
        env:
          ACIF_DIR: acif
          PYTHON: python
        run: scripts/acif-conformance.sh
