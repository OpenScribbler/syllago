[package]
name = "moat"
version = "0.1.0"
description = "Verify MOAT author-key signatures over ACIF content items"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
acif = { path = "../acif" }
ed25519-dalek = "3.0.0"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
sha2 = "0.11.1"

[dev-dependencies]
serde_json = "1.0.154"
