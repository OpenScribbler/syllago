[package]
name = "moat"
version = "0.1.0"
description = "Verify MOAT author-key signatures and Sigstore attestations over ACIF content items"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
acif = { path = "../acif" }
ed25519-dalek = "3.0.0"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sigstore-merkle = { version = "=0.15.1", default-features = false }
sigstore-verify = { version = "=0.15.1", default-features = false }

[features]
# The emulated security-key signer in `moat::testing`. Only this crate's own
# dev-dependency enables it; CI checks that within the workspace and fails if
# it is enabled outside dev-dependencies.
testing = []

[dev-dependencies]
moat = { path = ".", features = ["testing"] }
curve25519-dalek = "5.0.0"
