[package]
name = "apply"
version = "0.1.0"
description = "Syllago's apply engine: plan, snapshot, apply, record ownership, remove and detect drift"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
acif = { path = "../acif" }
adapters = { path = "../adapters" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
unicode-normalization = "0.1.26"

[dev-dependencies]
feed = { path = "../feed" }
moat = { path = "../moat" }
